<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parlez! – Französisch hören und nachsprechen</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#13233f;background:#f4f7fb}
*{box-sizing:border-box}
body{margin:0;padding:22px}
main{max-width:900px;margin:auto;background:#fff;border-radius:24px;padding:30px;box-shadow:0 10px 34px #17345a18}
h1{margin:0 0 5px;color:#0c2c60;font-size:36px}
.lead{margin:0 0 24px;color:#59677d;font-size:17px}
label{display:block;font-weight:750;margin:0 0 8px}
textarea{width:100%;min-height:270px;padding:16px;border:1px solid #c4cede;border-radius:14px;font:inherit;font-size:18px;line-height:1.55;resize:vertical;color:#14233c;background:#fff}
.actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:17px}
button{min-height:48px;border:0;border-radius:12px;padding:0 19px;font:inherit;font-weight:750;cursor:pointer}
#normal{background:#315bea;color:#fff}
#slow{background:#e7edff;color:#244ba7}
#stop{background:#edf0f4;color:#3c4658}
button:disabled{opacity:.45;cursor:not-allowed}
.status{margin-top:17px;padding:13px 15px;border-radius:12px;background:#f2f5f9;color:#43516a;line-height:1.4}
.warning{display:none;margin-bottom:18px;padding:14px 16px;border-radius:12px;background:#fff4d7;color:#624a09;line-height:1.45}
.meta{margin-top:10px;color:#758197;font-size:13px}
.help{margin-top:24px;padding-top:18px;border-top:1px solid #e4e9f0;color:#66748a;font-size:14px;line-height:1.55}
@media(max-width:600px){body{padding:9px}main{padding:20px;border-radius:18px}h1{font-size:30px}textarea{min-height:240px}.actions button{flex:1 1 135px}}
</style>
</head>
<body>
<main>
<h1>🇫🇷 Parlez!</h1>
<p class="lead">Schreibe etwas auf Französisch, höre gut zu und sprich es nach.</p>

<div id="warning" class="warning"></div>

<label for="text">Dein französischer Text</label>
<textarea id="text" lang="fr" spellcheck="true" placeholder="Écris ton texte ici…">Ma sœur habite à Paris. Elle aime surtout les cours de maths.</textarea>

<div class="actions">
  <button id="normal">▶ Anhören</button>
  <button id="slow">🐢 Langsam</button>
  <button id="stop">■ Stoppen</button>
</div>

<div id="status" class="status" aria-live="polite">Französische Stimme wird vorbereitet …</div>
<div id="meta" class="meta"></div>

<div class="help">
  Tipp: Höre einen Satz mehrmals an und sprich ihn anschließend laut nach.
  Für die beste französische Aussprache ist <strong>Google Chrome</strong> vorgesehen.
</div>
</main>

<script>
const textEl=document.getElementById("text");
const normalBtn=document.getElementById("normal");
const slowBtn=document.getElementById("slow");
const stopBtn=document.getElementById("stop");
const statusEl=document.getElementById("status");
const warningEl=document.getElementById("warning");
const metaEl=document.getElementById("meta");

let selectedVoice=null, runToken=0, stopped=false;

function isChrome(){
  const ua=navigator.userAgent;
  return /Chrome\//.test(ua) && !/Edg\//.test(ua) && !/OPR\//.test(ua);
}
function chooseVoice(){
  const voices=speechSynthesis.getVoices();
  const fr=voices.filter(v=>/^fr([-_]|$)/i.test(v.lang));
  selectedVoice =
    fr.find(v=>/google français/i.test(v.name) && /^fr[-_]FR$/i.test(v.lang)) ||
    fr.find(v=>/google/i.test(v.name) && /^fr[-_]FR$/i.test(v.lang)) ||
    null;

  if(selectedVoice){
    normalBtn.disabled=slowBtn.disabled=false;
    statusEl.textContent="Bereit.";
    metaEl.textContent="Stimme: "+selectedVoice.name+" · "+selectedVoice.lang;
    warningEl.style.display="none";
  }else{
    normalBtn.disabled=slowBtn.disabled=true;
    metaEl.textContent="";
    warningEl.style.display="block";
    warningEl.innerHTML=isChrome()
      ? "<strong>Google français (fr-FR) wurde auf diesem Gerät nicht gefunden.</strong><br>Parlez verwendet absichtlich keine andere Stimme, damit die Aussprachequalität nicht unbemerkt schlechter wird."
      : "<strong>Bitte öffne Parlez mit Google Chrome.</strong><br>Die getestete Stimme Google français (fr-FR) ist in diesem Browser nicht verfügbar.";
    statusEl.textContent="Die getestete französische Stimme ist nicht verfügbar.";
  }
}

function splitText(text){
  text=text.replace(/\r/g,"").trim();
  if(!text) return [];
  let sentences=text.split(/(?<=[.!?…])\s+|\n+/u).map(x=>x.trim()).filter(Boolean);
  const result=[];
  for(let s of sentences){
    while(s.length>240){
      let candidates=[s.lastIndexOf("; ",240),s.lastIndexOf(", ",240),s.lastIndexOf(" ",240)];
      let cut=Math.max(...candidates);
      if(cut<90) cut=240;
      result.push(s.slice(0,cut+1).trim());
      s=s.slice(cut+1).trim();
    }
    if(s) result.push(s);
  }
  return result;
}

function speak(rate){
  if(!selectedVoice){chooseVoice();return;}
  const chunks=splitText(textEl.value);
  if(!chunks.length){statusEl.textContent="Bitte zuerst einen französischen Text eingeben.";return;}

  speechSynthesis.cancel();
  stopped=false;
  const token=++runToken;
  let i=0;

  function next(){
    if(stopped || token!==runToken) return;
    if(i>=chunks.length){
      statusEl.textContent="Fertig – jetzt nachsprechen! 🇫🇷";
      return;
    }
    const u=new SpeechSynthesisUtterance(chunks[i]);
    u.voice=selectedVoice;
    u.lang="fr-FR";
    u.rate=rate;
    u.pitch=1;
    u.volume=1;
    const current=i+1, total=chunks.length;
    u.onstart=()=>statusEl.textContent=`▶ Abschnitt ${current} von ${total}`;
    u.onend=()=>{i++; setTimeout(next,100);};
    u.onerror=e=>{
      if(e.error==="canceled" || e.error==="interrupted") return;
      statusEl.textContent="Die Sprachausgabe wurde unterbrochen. Bitte nochmals versuchen.";
    };
    speechSynthesis.speak(u);
  }
  next();
}

normalBtn.addEventListener("click",()=>speak(1));
slowBtn.addEventListener("click",()=>speak(.78));
stopBtn.addEventListener("click",()=>{
  stopped=true; runToken++; speechSynthesis.cancel(); statusEl.textContent="Gestoppt.";
});

normalBtn.disabled=slowBtn.disabled=true;
chooseVoice();
speechSynthesis.onvoiceschanged=chooseVoice;
setTimeout(chooseVoice,300);
setTimeout(chooseVoice,1000);
</script>
</body>
</html>
