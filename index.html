<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parlez! V7</title><style>body{font-family:system-ui;background:#f6f7fb;color:#172033;margin:0}main,header{max-width:850px;margin:auto;padding:20px}.card{background:white;padding:24px;border-radius:18px;margin:18px 0}.target{font-size:32px;font-weight:800;text-align:center}button{padding:12px 16px;border:0;border-radius:10px;font-weight:700}.primary{background:#4f46e5;color:white}.muted{color:#667085}.hidden{display:none}.bad{background:#ffedd5;color:#9a3412;padding:6px;border-radius:7px}.word{padding:6px;display:inline-block;margin:2px}textarea,input{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 10px}</style></head><body><header><h2>🇫🇷 Parlez! V7 Browser</h2></header><main><div class="card"><div id="target" class="target">Ma sœur habite à Paris.</div><p style="text-align:center" class="muted">Die Erkennung läuft direkt im Browser.</p><p style="text-align:center"><button id="prepare" class="primary">1. Spracherkennung vorbereiten</button> <button id="rec" disabled>🎙️ 2. Sprechen</button> <button id="stop" disabled>⏹ Prüfen</button></p><p id="status" class="muted" style="text-align:center">Beim ersten Mal wird das kostenlose Whisper-Modell geladen.</p><div id="fb" class="hidden" style="text-align:center"><h2 id="verdict"></h2><div id="words"></div><details><summary>Erkannter Text</summary><p id="heard"></p></details></div></div><div class="card"><b>Test-Satz ändern</b><textarea id="edit">Ma sœur habite à Paris.</textarea><button id="use">Übernehmen</button></div></main>
<script type="module">import{pipeline}from"https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0";const $=x=>document.getElementById(x);let asr,ctx,stream,src,proc,chunks=[];
$("use").onclick=()=>{$("target").textContent=$("edit").value};
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/œ/g,"oe").replace(/[’'-]/g," ").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim()}
function lev(a,b){let d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let n=[i];for(let j=1;j<=b.length;j++)n[j]=Math.min(n[j-1]+1,d[j]+1,d[j-1]+(a[i-1]==b[j-1]?0:1));d=n}return d[b.length]}
function assess(t,h){let a=norm(t).split(" "),b=norm(h).split(" "),used=new Set(),bad=[];a.forEach((w,i)=>{let z=[99,-1];b.forEach((x,j)=>{if(used.has(j))return;let d=lev(w,x)/Math.max(w.length,x.length);if(d<z[0])z=[d,j]});if(z[1]>=0&&z[0]<=(w.length<4?.4:.3))used.add(z[1]);else bad.push(i)});return{a,bad,good:bad.length<=Math.max(1,Math.floor(a.length*.18))}}
$("prepare").onclick=async()=>{try{$("prepare").disabled=true;$("status").textContent="⏳ Whisper wird in den Browser geladen …";asr=await pipeline("automatic-speech-recognition","onnx-community/whisper-tiny",{dtype:"q8",device:"wasm",progress_callback:x=>{if(x.status==="progress"&&x.progress)$("status").textContent="⏳ Laden: "+Math.round(x.progress)+" %"}});$("status").textContent="✓ Bereit.";$("rec").disabled=false}catch(e){$("prepare").disabled=false;$("status").textContent="Laden fehlgeschlagen: "+e.message}}
$("rec").onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:true});ctx=new AudioContext({sampleRate:16000});src=ctx.createMediaStreamSource(stream);proc=ctx.createScriptProcessor(4096,1,1);chunks=[];proc.onaudioprocess=e=>chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));src.connect(proc);proc.connect(ctx.destination);$("rec").disabled=true;$("stop").disabled=false;$("status").textContent="🎙️ Aufnahme läuft …"}catch(e){$("status").textContent="Mikrofon: "+e.message}}
$("stop").onclick=async()=>{$("stop").disabled=true;proc.disconnect();src.disconnect();stream.getTracks().forEach(t=>t.stop());await ctx.close();let n=chunks.reduce((s,a)=>s+a.length,0),audio=new Float32Array(n),o=0;for(let a of chunks){audio.set(a,o);o+=a.length}$("status").textContent="⏳ Erkenne Französisch …";try{let out=await asr(audio,{language:"fr",task:"transcribe"}),h=out.text||"",r=assess($("target").textContent,h);$("fb").classList.remove("hidden");$("heard").textContent=h||"—";$("verdict").textContent=r.good?"🟢 Gut!":"🟠 Versuch es noch einmal.";$("words").innerHTML=r.a.map((w,i)=>`<span class="word ${r.bad.includes(i)?"bad":""}">${w}</span>`).join("");$("status").textContent="Analyse abgeschlossen."}catch(e){$("status").textContent="Analysefehler: "+e.message}finally{$("rec").disabled=false}}
</script></body></html>
